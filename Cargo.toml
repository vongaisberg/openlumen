[package]
name = "openlumen"
version = "0.1.0"
edition = "2021"

[dependencies]
# Embassy RP2350 support (pinned rev for reproducible builds)
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-rp", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-executor", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-net", features = ["defmt", "udp", "dhcpv4", "medium-ethernet", "tcp", "icmp", "dhcpv4-hostname"] }
embassy-net-wiznet = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-net-wiznet", features = ["defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-sync", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-futures" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec", package = "embassy-embedded-hal", features = ["defmt"] }

# PIO support
pio = "0.2"
pio-proc = "0.2"

# Logging and debugging
defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Async and embedded utilities
embedded-io-async = { version = "0.6.1", features = ["defmt-03"] }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.2", features = ["async"] }
static_cell = "2"
heapless = "0.8"
bitflags = "2"

# Serialization
serde = { version = "1", features = ["derive"], default-features = false }
serde-json-core = "0.6"
postcard = { version = "1", default-features = false }
crc = "3.0"

# Web server
picoserve = { version = "0.15", features = ["embassy"] }

# Utilities
itoa = "1.0"
rand_core = "0.6"
fixed = "1.28"
fixed-macro = "1.2"
littlefs2 = "0.6.1"
littlefs2-core = {version = "0.1.2", features= ["debug-error"]}
typenum = "1.19.0"

[profile.release]
debug = true
opt-level = "s"
lto = true

[profile.dev]
debug = true
opt-level = 1

# Patch picoserve's embassy dependencies to use the same git rev
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
