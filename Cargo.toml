[package]
name = "artnet_node"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-stm32 = { version = "0.2.0", features = ["defmt", "stm32f429zi", "unstable-pac", "memory-x", "time-driver-any", "exti", "chrono"] }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-net = { version = "0.7.0", features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet"] }

defmt = "0.3"
defmt-rtt = "0.4"
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embedded-io-async = { version = "0.6.1" }
static_cell = "2.1.0"
bitflags = "2.6.0"
heapless = "0.8.0"

[patch.crates-io]
#embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "a561a7625e1ea0eb3bd19a1fedf3a3d4ff484291" }
