[package]
name = "artnet_node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Embassy RP2350 HAL
embassy-rp = { version = "0.4", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net = { version = "0.7", features = ["defmt", "udp", "dhcpv4", "medium-ethernet"] }
embassy-net-wiznet = { version = "0.2" }
embassy-sync = "0.6"
embassy-futures = "0.1"

# PIO support
pio = "0.2"
pio-proc = "0.2"
fixed = "1.28"
fixed-macro = "1.2"

# Common dependencies
defmt = "0.3"
defmt-rtt = "0.4"
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embedded-io-async = "0.6"
embedded-hal-async = "1.0"
static_cell = "2"
heapless = "0.8"
bitflags = "2"
serde = { version = "1", features = ["derive"], default-features = false }
serde-json-core = "0.6"
picoserve = { version = "0.15", features = ["embassy"] }
smoltcp = { version = "0.12", default-features = false, features = ["socket", "async"] }
itoa = "1.0"
rand = { version = "0.8", default-features = false }

[profile.release]
debug = 2
opt-level = "s"
lto = true
